title: 探索中
group: Somewhere
extends: layouts/app
with: {title: 探索中}
slots:
  main:
    - chapter-tag: "MISSION 07 · ACTIVE"
    - text.title: "別急著看地圖。"
    - text: "城市正在慢慢給你提示。"
    - map: {label: "只顯示模糊方向", markers: ["你", "探索區域"], can: [pan]}
