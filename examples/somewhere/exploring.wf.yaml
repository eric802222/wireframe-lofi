    - alert: "附近似乎有什麼。抬頭看看紅磚拱廊。"
    - box: true
      col:
        - text.label: 需要一點幫忙？
        - text: "揭開下一個線索會少獲得 5 Memories。"
        - button: "揭開線索"
    - primary-action: {text: "我找到了！", to: discovered}
