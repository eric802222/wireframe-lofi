  - row: [ { image: { label: 08:40, ratio: 1/1 } }, { image: { label: 09:32, ratio: 1/1 } }, { image: { label: 空, ratio: 1/1 } }, { image: { label: 空, ratio: 1/1 } }, { image: { label: 空, ratio: 1/1 } }, { image: { label: 空, ratio: 1/1 } } ]
    gap: sm
  - row: [ "text.hint: 已挑 2 / 6", { spacer: }, { button: { text: 完成, to: d1-book-gen } } ]
